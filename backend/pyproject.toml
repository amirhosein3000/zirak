[project]
name = "zirak"
version = "0.1.0"
description = "Zirak — an explainable, risk-first smart trader built for the Wallex hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[project.scripts]
zirak = "zirak.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zirak*"]

[tool.setuptools.package-data]
zirak = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-3: Persian text legitimately contains "ambiguous" unicode. E501: the formatter owns line length.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
# Tests mutate objects and re-check attributes, which mypy's narrowing flags as unreachable.
disable_error_code = ["comparison-overlap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
