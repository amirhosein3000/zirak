# Deploy Zirak to Liara (servers in Iran, so the agent can reach api.wallex.ir).
#
# Manual only (Actions -> "Deploy to Liara" -> Run workflow): during the challenge the code that trades must
# not change on its own, and every run's manifest records the deployed commit.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   LIARA_API_TOKEN   Liara API token (from the team's account)
#   LIARA_TEAM_ID     Liara team id (leave unset to deploy to the token owner's personal account)
# Optional repository variables: LIARA_API_APP (default zirak-api), LIARA_WEB_APP (default zirak-web),
#   LIARA_API_URL (default https://<api app>.liara.run, baked into the web app).
# Optional secrets synced into the Liara API app on every deploy: WALLEX_API_KEY, WALLEX_SUB_ACCOUNT_CLIENT_ID,
#   LLM_API_KEY. Optional variables: LLM_BASE_URL, LLM_MODEL, WALLEX_PROP_PACKAGE_ID, ZIRAK_AGENT (shadow),
#   LIVE_TRADING (false), MAX_ORDER_TMN, MAX_ORDER_USDT, DAILY_LOSS_LIMIT_PCT, WALLEX_CREDIT_ACCOUNT (true).
#   Real orders only when LIVE_TRADING=true and ZIRAK_AGENT includes live: set those only after the team agrees.
name: Deploy to Liara

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [both, api, web]
        default: both

concurrency:
  group: liara-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend quality gates
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check . && ruff format --check . && mypy zirak tests && python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend quality gates
        working-directory: frontend
        run: npm ci && npm run lint && npx tsc --noEmit

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    env:
      LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
      LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
      API_APP: ${{ vars.LIARA_API_APP || 'zirak-api' }}
      WEB_APP: ${{ vars.LIARA_WEB_APP || 'zirak-web' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Liara CLI
        run: npm install -g @liara/cli
      - name: Check the token is set
        run: test -n "$LIARA_API_TOKEN" || { echo "::error::set the LIARA_API_TOKEN repository secret"; exit 1; }
      - name: Sync settings and trading secrets to the API app
        if: inputs.target != 'web'
        env:
          WALLEX_API_KEY: ${{ secrets.WALLEX_API_KEY }}
          WALLEX_SUB_ACCOUNT_CLIENT_ID: ${{ secrets.WALLEX_SUB_ACCOUNT_CLIENT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          WALLEX_PROP_PACKAGE_ID: ${{ vars.WALLEX_PROP_PACKAGE_ID }}
          WEB_URL: ${{ vars.LIARA_WEB_URL }}
        run: |
          # Non-secret settings come from repository variables (safe defaults: shadow mode, no real orders).
          set -- \
            "DATA_SOURCE=wallex" \
            "CORS_ORIGINS=${WEB_URL:-https://$WEB_APP.liara.run}" \
            "ZIRAK_AGENT=${{ vars.ZIRAK_AGENT || 'shadow' }}" \
            "ZIRAK_BOOTSTRAP=true" \
            "LIVE_TRADING=${{ vars.LIVE_TRADING || 'false' }}" \
            "MAX_ORDER_TMN=${{ vars.MAX_ORDER_TMN || '1500000' }}" \
            "MAX_ORDER_USDT=${{ vars.MAX_ORDER_USDT || '50' }}" \
            "DAILY_LOSS_LIMIT_PCT=${{ vars.DAILY_LOSS_LIMIT_PCT || '2.5' }}" \
            "WALLEX_CREDIT_ACCOUNT=${{ vars.WALLEX_CREDIT_ACCOUNT || 'true' }}"
          [ -n "$WALLEX_API_KEY" ] && set -- "$@" "WALLEX_API_KEY=$WALLEX_API_KEY"
          [ -n "$WALLEX_SUB_ACCOUNT_CLIENT_ID" ] && set -- "$@" "WALLEX_SUB_ACCOUNT_CLIENT_ID=$WALLEX_SUB_ACCOUNT_CLIENT_ID"
          [ -n "$WALLEX_PROP_PACKAGE_ID" ] && set -- "$@" "WALLEX_PROP_PACKAGE_ID=$WALLEX_PROP_PACKAGE_ID"
          if [ -n "$LLM_API_KEY" ] && [ -n "$LLM_BASE_URL" ] && [ -n "$LLM_MODEL" ]; then
            set -- "$@" "MOCK_LLM=false" "LLM_API_KEY=$LLM_API_KEY" "LLM_BASE_URL=$LLM_BASE_URL" "LLM_MODEL=$LLM_MODEL"
          fi
          liara env set --app "$API_APP" --api-token "$LIARA_API_TOKEN" ${LIARA_TEAM_ID:+--team-id "$LIARA_TEAM_ID"} --force "$@"
      - name: Deploy the API + trading agent
        if: inputs.target != 'web'
        working-directory: backend
        run: |
          liara deploy --app "$API_APP" --api-token "$LIARA_API_TOKEN" ${LIARA_TEAM_ID:+--team-id "$LIARA_TEAM_ID"} \
            --platform docker --port 8000 --build-location iran \
            --build-arg "GIT_COMMIT=${GITHUB_SHA}" --message "commit ${GITHUB_SHA}" --no-app-logs
      - name: Deploy the web app
        if: inputs.target != 'api'
        working-directory: frontend
        env:
          API_URL: ${{ vars.LIARA_API_URL }}
        run: |
          liara deploy --app "$WEB_APP" --api-token "$LIARA_API_TOKEN" ${LIARA_TEAM_ID:+--team-id "$LIARA_TEAM_ID"} \
            --platform docker --port 3000 --build-location iran \
            --build-arg "NEXT_PUBLIC_API_URL=${API_URL:-https://$API_APP.liara.run}" \
            --message "commit ${GITHUB_SHA}" --no-app-logs
